name: Gerar relatório SRAG

# Roda o agente na nuvem do GitHub: a chave fica guardada como "secret" do
# repositório (Settings > Secrets and variables > Actions > GOOGLE_API_KEY)
# e nunca aparece no código nem no log.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"  # segundas, 08:00 em Brasília

permissions:
  contents: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar agente
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_PROVEDOR: google
        run: PYTHONPATH=src python -m srag_agent
      - name: Publicar exemplo no repositório
        run: |
          mkdir -p docs/exemplo_relatorio
          cp outputs/* docs/exemplo_relatorio/
          cp logs/*.jsonl docs/exemplo_relatorio/trilha_auditoria.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/exemplo_relatorio
          git commit -m "Relatório SRAG gerado automaticamente" || echo "Sem mudanças"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-srag
          path: |
            outputs/
            logs/
