[project]
name = "srag-agent"
version = "1.0.0"
description = "Agente de IA que gera relatórios automatizados sobre SRAG (Open DATASUS + notícias)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
